
name: BotClash Brain Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BotClash_Brain_0_11_0_source.zip'

permissions:
  contents: read

jobs:
  build-brain-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Configure Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract BotClash Brain source
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 2 -type f -name 'BotClash_Brain_0_11_0_source.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "BotClash_Brain_0_11_0_source.zip was not found at repository root."
            exit 1
          fi
          mkdir -p build-source
          unzip -q "$ZIP" -d build-source
          SETTINGS_FILE="$(find build-source -type f -name settings.gradle -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle was not found in the source ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [ ! -d "$PROJECT_DIR/app/src/main/assets/enemy" ]; then
            echo "Packaged model assets are missing from the source ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$(dirname "$PROJECT_DIR")" >> "$GITHUB_ENV"

      - name: Run pure Java tests
        run: bash "$PROJECT_ROOT/scripts/run-pure-tests.sh"

      - name: Build Android debug APK
        run: gradle -p "$PROJECT_DIR" --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK and SHA-256
        shell: bash
        run: |
          mkdir -p release-output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
             "release-output/BotClash-Brain-0.11.0-alpha-debug.apk"
          sha256sum release-output/BotClash-Brain-0.11.0-alpha-debug.apk \
             > release-output/SHA256SUMS.txt
          ls -lh release-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BotClash-Brain-0.11.0-alpha-APK
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
          
